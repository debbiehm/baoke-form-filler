<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="保客填表">
<title>保客填表</title>
<style>
:root{
  --bg:#F6F1E7; --card:#FFFDF8; --ink:#1E2A24; --muted:#6B746E; --line:#E3DCCD;
  --green:#1F4E3D; --green-2:#2F6B54; --green-soft:#E6EFE9;
  --err:#B3261E; --err-soft:#FBE9E7; --warn:#9A6200; --warn-soft:#FFF3DC; --info:#2D5B86; --info-soft:#E8F0F8;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--green);color:#fff}
header h1{font-size:18px;margin:0 12px 0 0;font-weight:600;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.75;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--green-2)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2)}
.btn.danger{color:var(--err)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
header .btn:hover{background:rgba(255,255,255,.2)}
header .btn.light{background:#F6F1E7;color:var(--green);border-color:#F6F1E7;font-weight:600}
main{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;height:calc(100vh - 58px)}
aside,section,#checks{overflow:auto}
aside{border-right:1px solid var(--line);padding:12px}
#checks{border-left:1px solid var(--line);padding:14px;background:#FBF8F1}
section{padding:16px 22px 80px}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px}
.filters{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.filters button{font-size:12px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.filters button.on{background:var(--green);color:#fff;border-color:var(--green)}
.item{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.item:hover{background:var(--card)}
.item.sel{background:var(--card);border-color:var(--green-2)}
.item .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.b-err{background:var(--err-soft);color:var(--err)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-ok{background:var(--green-soft);color:var(--green)}
.count{font-size:12px;color:var(--muted);margin:2px 2px 8px}
.empty{color:var(--muted);text-align:center;padding:60px 20px}
.empty h2{color:var(--green);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;position:sticky;top:-16px;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--line)}
.bar h2{margin:0 auto 0 0;font-size:18px;color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--green);display:flex;align-items:center;gap:8px}
.card h3 .sp{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px 12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.f input,.f select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.f input:focus,.f select:focus{outline:2px solid var(--green-2);outline-offset:-1px;border-color:transparent}
.f.wide{grid-column:span 2}
.hint{font-size:11px;color:var(--green-2);min-height:14px}
.total{font-weight:600}
.total.ok{color:var(--green)}.total.bad{color:var(--err)}
#checks h3{margin:4px 0 8px;font-size:14px;color:var(--green)}
.ck{border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12.5px}
.ck b{display:block;font-size:11px;letter-spacing:.3px}
.ck.ERROR{background:var(--err-soft);color:var(--err)}.ck.WARNING{background:var(--warn-soft);color:var(--warn)}.ck.INFO{background:var(--info-soft);color:var(--info)}
.ok-box{background:var(--green-soft);color:var(--green);border-radius:8px;padding:10px;font-weight:600;margin-bottom:10px}
.manual{font-size:12px;color:var(--muted);padding-left:18px}
.modal{position:fixed;inset:0;background:rgba(20,30,25,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.dlg{background:var(--card);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.dlg.big{max-width:1000px;height:92vh;display:flex;flex-direction:column}
.dlg h3{margin:0 0 12px;color:var(--green)}
.dlg iframe{flex:1;border:1px solid var(--line);border-radius:8px;width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90vw;white-space:pre-line}
pre.log{background:#F3EEE3;padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto}
.captab{width:100%;border-collapse:collapse;font-size:13px}
.captab th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:4px}
.captab td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:middle}
.captab td:nth-child(2){white-space:nowrap;color:var(--muted)}
.captab input[type=text]{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px}
.captab tr.miss td:nth-child(2){color:#B9B2A3}
.chk{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:13px}
#printArea{display:none}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;width:210mm;height:296.5mm;page-break-after:always;break-after:page}
}
#pvPages{flex:1;overflow:auto;background:#E9E4D8;border-radius:8px;padding:8px}
#pvPages img{display:block;width:100%;max-width:820px;margin:0 auto 8px;box-shadow:0 1px 4px rgba(0,0,0,.15);background:#fff}
#tabs{display:none}
body.hosted .pr{display:none!important}
header .btns{display:contents}
@media (max-width:1100px){main{grid-template-columns:230px minmax(0,1fr)}#checks{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}main{height:auto}}
/* ---- phone: one screen at a time, bottom tab bar */
@media (max-width:760px){
  header{padding:10px 12px 8px;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--green)}
  header h1{width:100%;margin:0;font-size:17px}
  header .sub{display:none}
  header .btns{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  header .btns::-webkit-scrollbar{display:none}
  main{display:block;height:auto;padding-bottom:70px}
  aside,section,#checks{display:none;border:0;overflow:visible;padding:12px 14px}
  body[data-tab="list"] aside,body[data-tab="edit"] section,body[data-tab="check"] #checks{display:block}
  #checks{background:transparent}
  .bar{top:var(--hh,96px);margin:0 -14px 12px;padding:8px 14px}
  .bar h2{width:100%;font-size:16px}
  .bar .btn{flex:1;padding:9px 6px}
  .grid{grid-template-columns:1fr}
  .f.wide{grid-column:auto}
  .f input,.f select,.search,.captab input[type=text]{font-size:16px;padding:9px 10px}
  .item{padding:12px;background:var(--card);border-color:var(--line)}
  .card{padding:12px}
  .card h3{flex-wrap:wrap}
  .card h3 .sp{margin-left:0;width:100%;flex-wrap:wrap}
  .modal{padding:0}
  .dlg,.dlg.big{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column}
  .dlg>.row{margin-top:auto;padding-top:12px}
  .dlg .row .btn{flex:1;padding:11px}
  .captab td:nth-child(2){white-space:normal;font-size:12px}
  #tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  #tabs button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:13px;color:var(--muted);position:relative}
  #tabs button.on{color:var(--green);font-weight:600;box-shadow:inset 0 3px 0 var(--green)}
  #tabs .dot{position:absolute;top:5px;margin-left:4px;font-size:10px;background:var(--err);color:#fff;border-radius:9px;padding:0 5px}
  #toast{bottom:76px}
}
</style>
</head>
<body>
<header>
  <h1>保客填表</h1>
  <span class="sub">Great Eastern 提名 / 受托人表格 NBZ-FNOMI-V07-082025 · 资料只存在本电脑</span>
  <div class="btns">
  <button class="btn light" id="bPolicy">📄 上传保单（抓资料）</button>
  <button class="btn" id="bNew">＋ 新增保客</button>
  <button class="btn" id="bUpload">⇪ 批量上传 Excel/CSV</button>
  <button class="btn" id="bTemplate">下载批量模板</button>
  <button class="btn" id="bZip">导出全部 PDF (ZIP)</button>
  <button class="btn pr" id="bPrintAll">🖨 打印全部</button>
  <button class="btn" id="bExportData">导出资料 Excel</button>
  <button class="btn" id="bSettings">⚙ 设定</button>
  <button class="btn light" id="bInstall" hidden>📲 安装到手机</button>
  </div>
  <input type="file" id="file" accept=".xlsx,.xls,.csv" multiple hidden>
  <input type="file" id="policyFile" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" multiple hidden>
</header>
<main>
  <aside>
    <input class="search" id="q" placeholder="搜索姓名 / 保单号 / IC">
    <div class="filters" id="filters">
      <button data-f="all" class="on">全部</button><button data-f="ok">可导出</button><button data-f="err">需要修改</button>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </aside>
  <section id="editor"></section>
  <div id="checks"></div>
</main>

<div class="modal" id="mSettings"><div class="dlg">
  <h3>⚙ 设定（见证人＝代理时使用）</h3>
  <div class="grid">
    <div class="f wide"><label>代理姓名 Agent name</label><input id="sName"></div>
    <div class="f"><label>IAC No（留空＝手写）</label><input id="sIac"></div>
  </div>
  <div class="row"><button class="btn danger" id="bClear">清除全部保客资料</button><span style="flex:1"></span>
    <button class="btn" data-close>取消</button><button class="btn primary" id="bSaveSettings">保存</button></div>
</div></div>

<div class="modal" id="mPreview"><div class="dlg big">
  <h3 id="pvTitle">预览</h3>
  <div id="pvPages"></div>
  <div class="row"><button class="btn" data-close>关闭</button><button class="btn pr" id="pvPrint">🖨 打印</button><button class="btn primary" id="pvDownload">导出 PDF</button></div>
</div></div>

<div class="modal" id="mPolicy"><div class="dlg" style="max-width:720px">
  <h3 id="polTitle">从保单抓到的资料</h3>
  <p class="count" id="polNote"></p>
  <table class="captab"><thead><tr><th></th><th>栏位</th><th>抓到的值（可修改）</th></tr></thead><tbody id="polRows"></tbody></table>
  <div id="polNoms"></div>
  <label class="chk"><input type="checkbox" id="polAddrNom"> 受益人 1 的地址＝保单持有人地址（同住家人）</label>
  <div class="f" style="margin-top:10px"><label for="polTarget">填入</label><select id="polTarget"></select></div>
  <details style="margin-top:10px"><summary class="count">保单原文（抓不到的可以从这里复制）</summary><pre class="log" id="polRaw"></pre></details>
  <div class="row"><button class="btn" data-close>取消</button><button class="btn primary" id="polApply">套用</button></div>
</div></div>

<div class="modal" id="mAsk"><div class="dlg" style="max-width:420px;height:auto">
  <h3 id="askTitle"></h3>
  <p id="askMsg" style="white-space:pre-line;margin:0 0 10px"></p>
  <div class="f" id="askField" hidden><input id="askInput" type="password" autocomplete="off"></div>
  <div class="row"><button class="btn" id="askNo">取消</button><button class="btn primary" id="askYes">确定</button></div>
</div></div>

<div class="modal" id="mBusy"><div class="dlg" style="max-width:380px;text-align:center"><h3 id="busyMsg">处理中…</h3></div></div>
<div id="printArea"></div>

<div class="modal" id="mImport"><div class="dlg">
  <h3>批量上传结果</h3>
  <pre class="log" id="importLog"></pre>
  <div class="row"><button class="btn primary" data-close>好</button></div>
</div></div>

<nav id="tabs">
  <button data-tab="list">👥 保客</button><button data-tab="edit">✎ 资料</button><button data-tab="check">✓ 检查<span class="dot" id="tabDot" hidden></span></button>
</nav>
<div id="toast"></div>

<script type="text/plain" id="pdfWorker">/*__PDF_WORKER__*/</script>
<script>
"use strict";
const LAYOUT = /*__LAYOUT__*/null;
const STRIPS = /*__STRIPS__*/null;
const FORM_B64 = "/*__FORM_B64__*/";
const DEFAULT_SETTINGS = {agent_name: "", agent_iac: ""};  // each agent sets their own in ⚙ 设定

// ------------------------------------------------------------------ field spec (same as filler.py)
const YES_NO = ["Yes", "No"];
const PART2 = Object.keys(LAYOUT.PART2_OPTIONS);
const RELS = LAYOUT.RELATIONSHIPS;
const ADDRESS = [
  ["address1", "Mailing address line 1", "地址第 1 行"], ["address2", "Mailing address line 2", "地址第 2 行"],
  ["address3", "Mailing address line 3", "地址第 3 行"], ["postcode", "Postcode", "邮编 Postcode"],
  ["town", "Town", "城镇 Town"], ["country", "Country", "国家（空＝MALAYSIA）"]];
// [key, label in the old Excel template, 中文标签, choices]
const SECTIONS = [
  ["POLICY", 1, "", [
    ["proposal_no", "Proposal No (new proposal only)", "Proposal No（新投保才填）"],
    ["policy_no", "Policy No", "Policy No 保单号"],
    ["existing_trust", "Existing nomination is already a trust nomination? (Yes/No/Unknown)", "原提名已是信托提名？", ["Yes", "No", "Unknown"]],
    ["part2_option", "Trustee option, Part 2 (blank = no trustee)", "Part 2 受托人选项（空＝不委任）", PART2]]],
  ["POLICYOWNER", 1, "owner_", [
    ["name", "Full name as per NRIC/Passport", "姓名（按 IC / 护照）"],
    ["nric", "NRIC (12 digits) / Passport No", "NRIC / 护照号"],
    ["passport_expiry", "Passport expiry date (passport only)", "护照到期日（护照才填）"],
    ["muslim", "Muslim?", "回教徒？", YES_NO],
    ["status", "Marital status", "婚姻状况", ["Married", "Single", "Divorced", "Widowed"]],
    ["has_children", "Has children?", "有孩子？", YES_NO],
    ["children_count", "No. of children", "孩子人数"],
    ["gender", "Gender (used for checking only)", "性别（只用于核对，空＝看 IC）", ["Male", "Female"]],
    ["dob", "Date of birth (used for checking only)", "出生日期（只用于核对）"]]],
  ["NOMINEES", 4, "nominee", [
    ["name", "Full name as per NRIC/Passport", "姓名（按 IC / 护照）"],
    ["nric", "NRIC / Passport No", "NRIC / 护照号"],
    ["passport_expiry", "Passport expiry date (passport only)", "护照到期日"],
    ["share", "% of share (total must be 100)", "分配比例 %"],
    ["gender", "Gender (blank = from NRIC)", "性别（空＝看 IC）", ["Male", "Female"]],
    ["dob", "Date of birth (blank = from NRIC)", "出生日期（空＝看 IC）"],
    ["nationality", "Nationality (Malaysian or name of country)", "国籍（空＝Malaysian）"],
    ["relationship", "Relationship to policyowner", "与保单持有人关系", RELS],
    ["relationship_other", "Relationship if Others", "关系（选 Others 时）"],
    ...ADDRESS]],
  ["TRUSTEES", 2, "trustee", [
    ["name", "Full name as per NRIC/Passport", "姓名（按 IC / 护照）"],
    ["nric", "NRIC / Passport No", "NRIC / 护照号"],
    ["passport_expiry", "Passport expiry date (passport only)", "护照到期日"],
    ["gender", "Gender (blank = from NRIC)", "性别（空＝看 IC）", ["Male", "Female"]],
    ["dob", "Date of birth (blank = from NRIC)", "出生日期（空＝看 IC）"],
    ["nationality", "Nationality (Malaysian or name of country)", "国籍（空＝Malaysian）"],
    ["country_of_birth", "Country of birth (Malaysian or name of country)", "出生国家（空＝Malaysian）"],
    ["tel", "Tel no. incl. country code, e.g. 60123456789", "电话（例 012-345 6789）"],
    ["tel_country", "Tel country, e.g. MALAYSIA", "电话国家（空＝MALAYSIA）"],
    ["tel_type", "Tel type", "电话类型", ["Handphone", "House", "Office"]],
    ...ADDRESS]],
  ["WITNESS", 1, "witness_", [
    ["is_agent", "Witness is the agent?", "见证人是代理（我）？", YES_NO],
    ["name", "Witness name (blank = agent name in config.json)", "见证人姓名（空＝设定里的代理）"],
    ["iac", "Agent IAC No (blank = from config.json)", "IAC No（空＝设定）"],
    ["nric", "NRIC / Passport No (non-agent witness only)", "NRIC / 护照号"],
    ["passport_expiry", "Passport expiry date (non-agent, passport only)", "护照到期日"],
    ["dob", "Date of birth (non-agent witness only)", "出生日期"],
    ...ADDRESS.map(([k, en, zh]) => [k, en + " (non-agent witness only)", zh])]],
];
const SEC = Object.fromEntries(SECTIONS.map(s => [s[0], s]));
const CHOICES = {};
for (const [sec, , , fields] of SECTIONS) for (const f of fields) if (f[3]) CHOICES[sec + "." + f[0]] = f[3];

// flat column name for bulk sheets, e.g. owner_name, nominee2_share, trustee1_tel
function flatCols() {
  const cols = [];
  for (const [sec, n, prefix, fields] of SECTIONS)
    for (let i = 1; i <= n; i++)
      for (const f of fields) cols.push({col: (n > 1 ? `${prefix}${i}_` : prefix) + f[0], sec, idx: n > 1 ? i - 1 : null, key: f[0], f});
  return cols;
}
const FLAT = flatCols();
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9]/g, "");
const FLAT_BY_NORM = Object.fromEntries(FLAT.map(c => [norm(c.col), c]));

function blankData() {
  return {POLICY: {}, POLICYOWNER: {}, NOMINEES: [], TRUSTEES: [], WITNESS: {}};
}

// ------------------------------------------------------------------ helpers (ported from filler.py)
function clean(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) return fmtDate(fromJsDate(v));
  return String(v).replace(/\s+/g, " ").trim();
}
const upper = v => clean(v).toUpperCase();
const title = s => s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
function canon(v, choices) {
  const s = clean(v).toLowerCase();
  if (!s) return "";
  if (choices === YES_NO || choices.includes("Unknown")) { if (s === "y") return "Yes"; if (s === "n") return "No"; }
  return choices.find(c => c.toLowerCase() === s) || clean(v);
}
function mkDate(y, m, d) {
  const t = new Date(y, m - 1, d);
  return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d ? {y, m, d} : null;
}
function fromJsDate(dt) { const t = new Date(dt.getTime() + 12 * 3600e3); return {y: t.getFullYear(), m: t.getMonth() + 1, d: t.getDate()}; }
const pad = (n, w = 2) => String(n).padStart(w, "0");
const fmtDate = d => d ? `${pad(d.d)}/${pad(d.m)}/${d.y}` : "";
const cmpDate = (a, b) => (a.y - b.y) || (a.m - b.m) || (a.d - b.d);
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
function parseDate(v) {
  const s = clean(v);
  let m;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return mkDate(+m[3], +m[2], +m[1]);

};

// ------------------------------------------------------------------ bulk import
function cellValue(v) {
  if (v === null || v === undefined) return "";
  if (v instanceof Date) return fmtDate(fromJsDate(v));
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(+v.toFixed(6));
  return clean(v);
}
// Excel drops the leading 0 of NRICs / postcodes typed as numbers
function fixNumber(key, raw, s) {
  if (typeof raw !== "number" || !/^\d+$/.test(s)) return s;
  if (key === "nric" && s.length < 12 && s.length >= 10) return s.padStart(12, "0");
  if (key === "postcode" && s.length === 4) return s.padStart(5, "0");
  return s;
}
function setField(data, sec, idx, key, raw) {
  const v = fixNumber(key, raw, cellValue(raw));
  if (!v) return;
  if (idx === null) data[sec][key] = v;
  else { while (data[sec].length <= idx) data[sec].push({}); data[sec][idx][key] = v; }
}
function tidy(data) {
  data.NOMINEES = data.NOMINEES.filter(filled);
  data.TRUSTEES = data.TRUSTEES.filter(filled);
  return data;
}
function parseVertical(rows) {
  const labelMap = {};
  for (const [sec, n, , fields] of SECTIONS) labelMap[sec] = Object.fromEntries(fields.map(f => [f[1], [f[0], n]]));
  const data = blankData();
  let sec = null;
  for (const row of rows) {
    const a = clean(row[0]);
    if (labelMap[a]) { sec = a; continue; }
    if (!sec || !labelMap[sec][a]) continue;
    const [key, n] = labelMap[sec][a];
    for (let i = 0; i < n; i++) setField(data, sec, n > 1 ? i : null, key, row[1 + i]);
  }
  return tidy(data);
}
function parseFlat(rows) {
  const hi = rows.findIndex(r => (r || []).some(c => FLAT_BY_NORM[norm(c)]));
  if (hi < 0) return [];
  const map = rows[hi].map(c => FLAT_BY_NORM[norm(c)] || null);
  const list = [];
  for (const row of rows.slice(hi + 1)) {
    if (!row || !row.some(c => cellValue(c))) continue;
    const data = blankData();
    map.forEach((m, j) => m && setField(data, m.sec, m.idx, m.key, row[j]));
    list.push(tidy(data));
  }
  return list;
}
async function importFiles(files) {
  const log = [];
  let added = 0;
  for (const file of files) {
    try {
      const wb = XLSX.read(await file.arrayBuffer(), {type: "array", cellDates: true, raw: false});
      let n = 0;
      for (const name of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header: 1, raw: true, defval: null, blankrows: false});
        const vertical = rows.some(r => ["POLICY", "POLICYOWNER", "NOMINEES"].includes(clean(r && r[0])));
        const datas = vertical ? [parseVertical(rows)] : parseFlat(rows);
        for (const data of datas) {
          customers.push({id: uid(), data, source: file.name, created: new Date().toISOString()});
          n++;
        }
      }
      added += n;
      log.push(`${file.name}: ${n ? `加入 ${n} 位保客` : "找不到可读的资料（请用「下载批量模板」的格式）"}`);
    } catch (e) {
      log.push(`${file.name}: 读取失败 - ${e.message}`);
    }
  }
  save();
  if (added) selId = customers[customers.length - added].id;
  const fresh = customers.slice(customers.length - added).map(checkOf);
  const bad = fresh.filter(r => r.errors).length;
  log.push("", `共加入 ${added} 位：${added - bad} 位可直接导出，${bad} 位需要修改（红色）。`);
  document.getElementById("importLog").textContent = log.join("\n");
  openModal("mImport");
  renderAll(); setTab("list");
}

function sheetFrom(aoa) {

const safe = s => s.replace(/[\\/:*?"<>|]+/g, "").trim();
function pdfName(c, chk) {
  const ref = chk.out.policy.policy_no || chk.out.policy.proposal_no || "NOPOLICY";
  return safe(`${ref}_${chk.out.owner.name || "CLIENT"}.pdf`);
}
// Opened from a claude.ai link the page runs in a frame: files go through the app's save prompt
// and printing happens from the saved PDF. Opened as a local file it downloads and prints directly.
const HOSTED = (() => { try { return window.self !== window.top; } catch { return true; } })();
const saver = HOSTED && window.claude?.use ? window.claude.use("downloads") : Promise.resolve(null);
async function downloadBlob(blob, name) {
  const dl = await saver;
  if (dl) {
    try { await dl.save({filename: name, data: blob}); return true; }
    catch (e) { if (e && e.code !== "declined") toast(`没能保存：${e.message || e.code}`); return false; }
  }
  if (HOSTED) { toast("这里不能保存文件，请在 Claude App 或浏览器里打开链接"); return false; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
// in-page replacement for confirm()/prompt(), which a hosted page cannot show
function ask(title, msg, {password = false, ok = "确定"} = {}) {
  return new Promise(res => {
    $("askTitle").textContent = title; $("askMsg").textContent = msg; $("askYes").textContent = ok;
    $("askField").hidden = !password; $("askInput").value = "";
    const done = v => { $("mAsk").classList.remove("open"); $("askYes").onclick = $("askNo").onclick = $("askInput").onkeydown = null; res(v); };
    $("askYes").onclick = () => done(password ? $("askInput").value : true);
    $("askNo").onclick = () => done(password ? null : false);
    $("askInput").onkeydown = e => { if (e.key === "Enter") $("askYes").click(); };
    openModal("mAsk");
    if (password) setTimeout(() => $("askInput").focus(), 50);
  });
}

  return {bytes: await buildPdf(chk.out), name: pdfName(c, chk)};
}

async function exportZip() {
  if (!customers.length) return toast("还没有保客资料");
  const zip = new JSZip(), skipped = [], used = new Set();
  let n = 0;
  for (const c of customers) {
    try {
      let {bytes, name} = await makePdf(c);
      while (used.has(name)) name = name.replace(/(\(\d+\))?\.pdf$/, m => `(${(parseInt(m.slice(1)) || 1) + 1}).pdf`);
      used.add(name); zip.file(name, bytes); n++;
    } catch (e) { skipped.push(displayName(c)); }
  }
  if (!n) return toast("没有可导出的保客（全部还有错误）");
  if (await downloadBlob(await zip.generateAsync({type: "blob"}), `提名表格_${today.y}${pad(today.m)}${pad(today.d)}.zip`))
    toast(`已导出 ${n} 份 PDF` + (skipped.length ? `\n跳过 ${skipped.length} 位（还有错误）：${skipped.join("、")}` : ""));
}

// ------------------------------------------------------------------ printing (pages rendered as images, so it works from a local file)
let workerSet = false;
function pdfjs() {
  if (!workerSet) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([document.getElementById("pdfWorker").textContent], {type: "text/javascript"}));
    workerSet = true;
  }
  return pdfjsLib;
}
function busy(msg) { if (msg) { $("busyMsg").textContent = msg; openModal("mBusy"); } else $("mBusy").classList.remove("open"); }
// renders every page of a PDF as <img> into `box` (used for preview and printing; phones can't show PDFs inline)
async function renderPages(bytes, box, scale, label) {
  const doc = await pdfjs().getDocument({data: bytes.slice()}).promise;
  for (let p = 1; p <= doc.numPages; p++) {
    busy(`${label}… 第 ${box.children.length + 1} 页`);
    const page = await doc.getPage(p), vp = page.getViewport({scale});
    const cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    // intent "print" avoids requestAnimationFrame, which stalls in background tabs on phones
    await page.render({canvasContext: cv.getContext("2d"), viewport: vp, intent: "print"}).promise;
    const img = new Image();
    await new Promise(r => { img.onload = img.onerror = r; img.src = cv.toDataURL("image/png"); });
    box.appendChild(img);
  }
}
async function printPdfs(list) {
  const area = $("printArea");
  area.innerHTML = "";
  try { for (const bytes of list) await renderPages(bytes, area, 2.5, "准备打印"); } finally { busy(); }
  window.print();
}
window.addEventListener("afterprint", () => { $("printArea").innerHTML = ""; });
async function printOne(c) {
  try { const {bytes} = await makePdf(c); await printPdfs([bytes]); } catch (e) { busy(); toast(e.message); }
}
async function printAll() {
  const list = [], skipped = [];
  for (const c of customers) {
    try { list.push((await makePdf(c)).bytes); } catch { skipped.push(displayName(c)); }
  }
  if (!list.length) return toast("没有可打印的保客（全部还有错误）");
  if (skipped.length) toast(`跳过 ${skipped.length} 位（还有错误）：${skipped.join("、")}`);
  await printPdfs(list);
}

// ------------------------------------------------------------------ capture details from an uploaded policy
// Text PDFs are read directly (offline). Scanned PDFs / photos need OCR, which downloads tesseract.js once;
// the document itself is read inside this browser and never uploaded.
const TESSERACT_URL = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrWorker = null;
async function ocr(image) {
  // the OCR engine downloads its data at run time, which a hosted page is not allowed to do
  if (HOSTED) throw new Error("手机链接版不能读取照片 / 扫描件，请用电脑版或手动输入。GE 电子保单 PDF 可以直接读取。");
  if (!window.Tesseract) await new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = TESSERACT_URL; s.onload = res;
    s.onerror = () => rej(new Error("这是扫描件/图片，需要上网下载文字识别工具（只下载工具，保单不会上传）"));
    document.head.appendChild(s);
  });
  if (!ocrWorker) ocrWorker = await Tesseract.createWorker("eng");
  const {data} = await ocrWorker.recognize(image);
  return data.text.split("\n").map(s => s.replace(/\s{2,}/g, "  ").trim()).filter(Boolean);
}
// lines of text; columns that are far apart are joined with "  " so labels and values stay separable
async function documentLines(file) {
  if (/\.(jpe?g|png)$/i.test(file.name)) { busy(`识别图片文字… ${file.name}`); return {lines: await ocr(file), ocr: true}; }
  const task = pdfjs().getDocument({data: new Uint8Array(await file.arrayBuffer())});
  task.onPassword = (update, reason) => {  // GE e-policies are password protected
    busy();
    ask("保单密码", `${file.name}\n${reason === 2 ? "密码不对，请再输入。" : "这份保单有密码，请输入密码。"}`, {password: true})
      .then(pw => { if (pw === null) task.destroy(); else { busy(`读取保单… ${file.name}`); update(pw); } });
  };
  let doc;
  try { doc = await task.promise; } catch (e) {
    throw new Error(e.name === "PasswordException" || /destroy/i.test(e.message) ? "没有输入密码，无法读取" : e.message);
  }
  const lines = [], scanned = [];
  let usedOcr = false;
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    const page = await doc.getPage(p);
    const items = (await page.getTextContent()).items.filter(i => i.str && i.str.trim())
      .map(i => ({x: i.transform[4], y: i.transform[5], w: i.width, h: Math.abs(i.transform[3]) || 8, s: i.str}));
    if (items.length < 5) { scanned.push(page); continue; }
    items.sort((a, b) => b.y - a.y || a.x - b.x);
    const rows = [];
    for (const it of items) {
      const r = rows.find(r => Math.abs(r.y - it.y) <= Math.max(2.5, it.h * 0.35));
      r ? r.items.push(it) : rows.push({y: it.y, items: [it]});
    }
    rows.sort((a, b) => b.y - a.y);
    for (const r of rows) {
      r.items.sort((a, b) => a.x - b.x);
      let s = "", end = null;
      for (const it of r.items) {
        if (end !== null) { const gap = it.x - end; s += gap > it.h * 1.2 ? "  " : gap > it.h * 0.15 ? " " : ""; }
        s += it.s.trim(); end = it.x + it.w;
      }
      lines.push(s.replace(/ {3,}/g, "  ").trim());
    }
  }
  // fully scanned document: read the first few pages with OCR
  if (lines.length < 15)
    for (const page of scanned.slice(0, 3)) {
      busy(`识别扫描页文字… 第 ${page.pageNumber} 页`);
      const vp = page.getViewport({scale: 2.5}), cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext("2d"), viewport: vp, intent: "print"}).promise;
      lines.push(...await ocr(cv));
      usedOcr = true;
    }
  return {lines: lines.filter(Boolean), ocr: usedOcr};
}

const IC_RE = /\b(\d{6})\s?-?\s?(\d{2})\s?-?\s?(\d{4})\b/;
const POSTCODE_RE = /\b(\d{5})\b/;
const STATES = /\b(PULAU PINANG|PENANG|SELANGOR|JOHOR|KEDAH|PERAK|KELANTAN|TERENGGANU|PAHANG|MELAKA|MALACCA|NEGERI SEMBILAN|PERLIS|SABAH|SARAWAK|W\.?\s?P\.?|WILAYAH PERSEKUTUAN|KUALA LUMPUR|PUTRAJAYA|LABUAN|MALAYSIA)\b/gi;
const REL_WORDS = [[/\b(husband|suami)\b/i, "Husband"], [/\b(wife|isteri|istri)\b/i, "Wife"], [/\b(son|anak lelaki)\b/i, "Son"],
  [/\b(daughter|anak perempuan)\b/i, "Daughter"], [/\b(father|bapa|ayah)\b/i, "Father"], [/\b(mother|ibu|emak)\b/i, "Mother"],
  [/\b(brother|abang|adik lelaki)\b/i, "Brother"], [/\b(sister|kakak|adik perempuan)\b/i, "Sister"]];
const LABELS = {
  policy_no: /\b(policy|certificate|polisi|sijil)\s*(no|number|num|nombor)\b\.?|\bno\.?\s*(polisi|sijil)\b/i,
  proposal_no: /\b(proposal|cadangan)\s*(no|number|nombor)\b\.?|\bno\.?\s*cadangan\b/i,
  owner: /\b(name\s+of\s+)?(policy\s*-?\s*owner|policyholder|policy\s*holder|proposer|participant|pemunya\s*polisi|pemegang\s*polisi|pencadang)(\s*&\s*life\s*assured)?(\s*name)?(?!\s*'\s*s)\b/i,
  assured: /\b(life\s*(to\s*be\s*)?assured|life\s*insured|insured\s*person|person\s*covered|orang\s*yang\s*diinsuranskan)\b/i,
  nric: /\b(nric|new\s*i\.?\/?c|i\.?\/?c\.?|mykad|identity\s*card|id\s*no|no\.?\s*k\.?\/?p\.?|kad\s*pengenalan)\b/i,
  dob: /\b(date\s*of\s*birth|d\.?o\.?b\.?|tarikh\s*lahir)\b/i,
  gender: /\b(sex|gender|jantina)\b/i,
  religion: /\b(religion|agama)\b/i,
  status: /\b(marital\s*status|taraf\s*perkahwinan|status\s*perkahwinan)\b/i,
  address: /\b(mailing|correspondence|residential|home|postal)?\s*address\b|\balamat\b|\bpolicyowner\s*'\s*s(?=\s*:)/i,
  nominee: /\b(nominee|penama|beneficiar)/i,
};
const anyLabel = s => Object.entries(LABELS).some(([k, re]) => k !== "address" && re.test(s));
// value on the same line after the label, else the next line
function after(lines, re, test = v => v, from = 0) {
  for (let i = from; i < lines.length; i++) {
    const m = lines[i].match(re);
    if (!m) continue;
    const rest = lines[i].slice(m.index + m[0].length).replace(/^[\s:.\-–/|]+/, "");
    for (const cand of [rest, lines[i + 1] || ""]) { const v = test(cand); if (v) return {v, i}; }
  }
  return null;
}
const firstCell = s => s.split("  ")[0].trim();
const TITLES = /^(MISS|MR|MRS|MDM|MS|MADAM|DR|ENCIK|EN|PUAN|PN|CIK|TUAN|DATO'?|DATIN|DATUK)\.?\s+/;
// names are printed in capitals on policies; sentences in mixed case are skipped
const asName = s => {
  const raw = firstCell(s.replace(IC_RE, "")).replace(/^[\s:.\-]+/, "");
  if (/[a-z]/.test(raw) || raw.split(" ").length > 8) return "";
  const v = raw.replace(/[^A-Za-z@'./\- ]/g, " ").replace(/\s+/g, " ").trim().toUpperCase().replace(TITLES, "");
  return v.length >= 4 && /[A-Z]{2}/.test(v) && !anyLabel(v) && !/\b(SIGNATURE|TANDATANGAN|DATE|DETAILS|BUTIRAN|PARTICULARS|ADDRESS|ALAMAT)\b/.test(v) ? v : "";
};
const asIc = s => { const m = s.match(IC_RE); return m ? `${m[1]}-${m[2]}-${m[3]}` : ""; };
const asPolicy = s => { const m = s.replace(/\s/g, " ").match(/\b([A-Z]{0,3}\d[\dA-Z-]{5,13})\b/i); return m ? m[1].replace(/-/g, "").toUpperCase() : ""; };
const asDate = s => {
  const m = s.match(/\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\b/) || s.match(/\b(\d{1,2})[ \-]([A-Za-z]{3,9})[ \-,]+(\d{4})\b/);
  if (!m) return "";
  let mo = +m[2];
  if (isNaN(mo)) { mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase()) + 1; if (!mo) return ""; }
  const d = mkDate(+m[3], mo, +m[1]);
  return d ? fmtDate(d) : "";
};
const asGender = s => /\b(male|lelaki|m)\b/i.test(firstCell(s)) && !/female/i.test(firstCell(s)) ? "Male" : /\b(female|perempuan|f)\b/i.test(firstCell(s)) ? "Female" : "";
const asStatus = s => { const v = firstCell(s);
  return /married|berkahwin/i.test(v) ? "Married" : /single|bujang/i.test(v) ? "Single" : /divorc|bercerai/i.test(v) ? "Divorced" : /widow|balu|duda/i.test(v) ? "Widowed" : ""; };

// address cells of a line (GE prints the address in two columns, with "ADDRESS" as a label cell)
const addrCells = s => s.split("  ").map(x => x.replace(/^[\s:.\-|]+/, "").trim())
  .filter(x => x && !/^(address|alamat)$/i.test(x) && !anyLabel(x) && !/[a-z]{4,}/.test(x));
function addressFrom(lines, i, firstParts) {
  const parts = [...firstParts];
  for (let j = i + 1; j < Math.min(lines.length, i + 7) && !parts.some(p => POSTCODE_RE.test(p)); j++) {
    if (anyLabel(lines[j]) && !/^(address|alamat)\b/i.test(lines[j].trim())) break;
    parts.push(...addrCells(lines[j]));
  }
  const k = parts.findIndex(p => POSTCODE_RE.test(p));
  return k < 0 ? null : parseAddress(parts, k);
}
function captureAddress(lines) {
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(LABELS.address);
    if (!m || /e-?mail/i.test(lines[i].slice(Math.max(0, m.index - 8), m.index + m[0].length))) continue;
    if (/[a-z]{4,}/.test(lines[i]) && !/^\s*:/.test(lines[i].slice(m.index + m[0].length))) continue;  // a sentence, not a label
    const a = addressFrom(lines, i, addrCells(lines[i].slice(m.index + m[0].length)));
    if (a) return a;
  }
  // unlabelled fallback: the lines under the addressee of a cover letter
  const n = titledName(lines);
  return n ? addressFrom(lines, n.i, []) : null;
}
function parseAddress(parts, k) {
  const pcLine = parts[k], pc = pcLine.match(POSTCODE_RE);
  const before = pcLine.slice(0, pc.index).replace(/[,\s]+$/, "");
  const town = pcLine.slice(pc.index + 5).replace(STATES, "").replace(/[^A-Za-z .'\-]/g, " ").replace(/\s+/g, " ").trim();
  const rows = [...parts.slice(0, k), before].map(s => s.replace(/[,\s]+$/, "").trim()).filter(Boolean);
  while (rows.length > 3) rows.splice(rows.length - 2, 2, rows[rows.length - 2] + ", " + rows[rows.length - 1]);
  const up = s => (s || "").toUpperCase();
  return {address1: up(rows[0]), address2: up(rows[1]), address3: up(rows[2]), postcode: pc[1], town: up(town), country: "MALAYSIA"};
}
function captureNominees(lines) {
  const start = lines.findIndex(l => LABELS.nominee.test(l));
  if (start < 0) return [];
  const out = [];
  for (let i = start; i < Math.min(lines.length, start + 40); i++) {
    const l = lines[i], ic = asIc(l), pct = l.match(/\b(\d{1,3}(?:\.\d{1,2})?)\s*%/);
    if (!ic || !pct) continue;
    const rel = (REL_WORDS.find(([re]) => re.test(l)) || [])[1] || "";
    const name = asName(l.slice(0, l.search(IC_RE))) || asName(lines[i - 1] || "");
    out.push({name, nric: ic, share: pct[1], relationship: rel});
  }
  return out.slice(0, 4);
}
// unlabelled fallback: the addressee line of a cover letter, e.g. "MISS TAN MEI LING"
function titledName(lines) {
  const i = lines.findIndex(l => TITLES.test(l.trim()) && asName(l));
  return i < 0 ? null : {v: asName(lines[i]), i};
}
function extractPolicy(lines) {
  const f = {};
  const set = (k, r) => { if (r) f[k] = r.v; return r; };
  set("policy_no", after(lines, LABELS.policy_no, asPolicy));
  set("proposal_no", after(lines, LABELS.proposal_no, asPolicy));
  // unlabelled fallback: the addressee line of the cover letter, e.g. "MISS TAN MEI LING"
  const own = set("name", after(lines, LABELS.owner, asName) || titledName(lines));
  // NRIC: the one nearest after the policyowner label, else the first in the document
  const icFrom = own ? own.i : 0;
  const icLine = from => { const i = lines.findIndex((l, k) => k >= from && IC_RE.test(l)); return i < 0 ? null : {v: asIc(lines[i]), i}; };
  set("nric", (own && icLine(own.i) && icLine(own.i).i <= own.i + 2 ? icLine(own.i) : null)
    || after(lines, LABELS.nric, asIc, icFrom) || icLine(icFrom) || icLine(0));
  set("dob", after(lines, LABELS.dob, asDate, icFrom) || after(lines, LABELS.dob, asDate));
  set("gender", after(lines, LABELS.gender, asGender, icFrom) || after(lines, LABELS.gender, asGender));
  const rel = after(lines, LABELS.religion, s => firstCell(s));
  if (rel) f.muslim = /islam|muslim/i.test(rel.v) ? "Yes" : "No";
  set("status", after(lines, LABELS.status, asStatus));
  const la = after(lines, LABELS.assured, asName);
  return {f, assured: la ? la.v : "", address: captureAddress(lines), nominees: captureNominees(lines)};
}

const CAPTURE_FIELDS = [["policy_no", "POLICY", "Policy No 保单号"], ["proposal_no", "POLICY", "Proposal No"],
  ["name", "POLICYOWNER", "保单持有人姓名"], ["nric", "POLICYOWNER", "保单持有人 NRIC"], ["dob", "POLICYOWNER", "出生日期"],
  ["gender", "POLICYOWNER", "性别"], ["muslim", "POLICYOWNER", "回教徒？"], ["status", "POLICYOWNER", "婚姻状况"]];
const ADDR_KEYS = ADDRESS.map(a => a[0]);
let pending = null;  // capture waiting for review

function applyCapture(c, cap, opts) {
  const d = c.data;
  for (const [k, sec] of CAPTURE_FIELDS) if (opts.fields[k]) d[sec][k] = opts.fields[k];
  if (opts.address) c.policyAddress = opts.address;
  if (opts.nominees && opts.nominees.length) d.NOMINEES = opts.nominees.map(n => ({nationality: "Malaysian", ...n}));
  if (opts.addrToNominee1 && c.policyAddress) {
    if (!d.NOMINEES.length) d.NOMINEES.push({nationality: "Malaysian"});
    Object.assign(d.NOMINEES[0], c.policyAddress);
  }
  c.source = "保单 " + cap.file;
}
function newCustomer(source) {
  return {id: uid(), source, created: new Date().toISOString(), data: {
    POLICY: {}, POLICYOWNER: {muslim: "No", status: "Married", has_children: "Yes"},
    NOMINEES: [{nationality: "Malaysian"}], TRUSTEES: [], WITNESS: {is_agent: "Yes"}}};
}
async function importPolicies(files) {
  const caps = [];
  for (const file of files) {
    try {
      busy(`读取保单… ${file.name}`);
      const {lines, ocr: usedOcr} = await documentLines(file);
      caps.push({file: file.name, lines, ocr: usedOcr, ...extractPolicy(lines)});
    } catch (e) { caps.push({file: file.name, error: e.message}); }
  }
  busy();
  if (caps.length === 1 && !caps[0].error) return reviewCapture(caps[0]);
  // several policies: one new client each, with everything that was found
  const log = [];
  for (const cap of caps) {
    if (cap.error) { log.push(`✗ ${cap.file}: ${cap.error}`); continue; }
    const c = newCustomer("");
    const fields = {...cap.f};
    if (fields.policy_no) delete fields.proposal_no;
    applyCapture(c, cap, {fields, address: cap.address});
    customers.push(c); selId = c.id;
    const got = CAPTURE_FIELDS.filter(([k]) => cap.f[k]).map(f => f[2]);
    log.push(`✓ ${cap.file}: ${cap.f.name || "（姓名没抓到）"} - 抓到 ${got.length ? got.join("、") : "无"}${cap.address ? "、地址" : ""}${cap.ocr ? "（文字识别，请仔细核对）" : ""}`);
  }
  log.push("", "请逐位打开核对资料，再补上受益人 / 受托人。");
  save(); renderAll(); setTab("list");
  $("importLog").textContent = log.join("\n");
  openModal("mImport");
}
function reviewCapture(cap) {
  pending = cap;
  $("polTitle").textContent = `从保单抓到的资料：${cap.file}`;
  const found = CAPTURE_FIELDS.filter(([k]) => cap.f[k]).length;
  $("polNote").textContent = (found ? `抓到 ${found} 项，请对照保单核对后按「套用」。` : "没有抓到资料 - 可能是格式不同。请从下面的保单原文复制，或手动填写。")
    + (cap.ocr ? " ⚠ 这是扫描件/图片，文字识别可能有错字，务必逐字核对。" : "")
    + (cap.assured && cap.assured !== cap.f.name ? ` 受保人 Life assured：${cap.assured}（与持有人不同，表格填的是持有人）` : "");
  const row = (key, label, v, ok = true) => `<tr class="${v ? "" : "miss"}"><td><input type="checkbox" data-k="${key}" ${v && ok ? "checked" : ""}></td>
    <td>${esc(label)}</td><td><input type="text" data-v="${key}" value="${esc(v || "")}" placeholder="没抓到"></td></tr>`;
  // Proposal No is only for new proposals - not needed once the policy number exists
  let h = CAPTURE_FIELDS.map(([k, , label]) => row(k, label, cap.f[k], !(k === "proposal_no" && cap.f.policy_no))).join("");
  const a = cap.address || {};
  h += ADDRESS.map(([k, , zh]) => row("addr_" + k, "持有人" + zh, a[k] || (k === "country" && cap.address ? "MALAYSIA" : ""))).join("");
  $("polRows").innerHTML = h;

    ${cap.nominees.map(n => esc(`${n.name || "?"} ${n.share}%`)).join("，")}</label>` : "";
  $("polAddrNom").checked = false;

  $("polRaw").textContent = cap.lines.join("\n");

}
function confirmCapture() {
  const cap = pending, val = k => upper(document.querySelector(`[data-v="${k}"]`).value),
    on = k => document.querySelector(`[data-k="${k}"]`).checked;
  const fields = {};

  tmr = setTimeout(() => {
    save(); renderList(); renderChecks();
    const chk = checkOf(c);
    document.querySelectorAll('[data-act="preview"],[data-act="export"]').forEach(b => b.disabled = !!chk.errors);
    document.querySelector(".bar h2").textContent = displayName(c);
  }, 250);
}
$("editor").addEventListener("input", onEdit);
$("editor").addEventListener("change", onEdit);
$("editor").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"), c = cur();
  if (!b || !c) return;
  const d = c.data, act = b.dataset.act, i = +b.dataset.i;
  if (act === "preview") return preview(c);
  if (act === "export") return exportOne(c);
  if (act === "print") return printOne(c);
  if (act === "ownerAddr" && c.policyAddress) Object.assign(d[b.dataset.sec][i], c.policyAddress);
  if (act === "del") {
    ask("删除保客", `删除 ${displayName(c)} 的资料？`, {ok: "删除"}).then(yes => {
      if (!yes) return;
      const k = customers.indexOf(c); customers.splice(k, 1);
      selId = (customers[k] || customers[k - 1] || {}).id || null;
      save(); renderAll(); setTab("list");
    });
    return;
  }
  if (act === "dup") {
    const copy = {id: uid(), data: JSON.parse(JSON.stringify(d)), source: "复制自 " + displayName(c), created: new Date().toISOString()};
    customers.splice(customers.indexOf(c) + 1, 0, copy); selId = copy.id;
  }
  if (act === "addNom") d.NOMINEES.push({nationality: "Malaysian"});
  if (act === "addTr") d.TRUSTEES.push({nationality: "Malaysian", country_of_birth: "Malaysian"});
  if (act === "rm") d[b.dataset.sec].splice(i, 1);
  if (act === "sameAddr" && d.NOMINEES[0]) for (const [k] of ADDRESS) d[b.dataset.sec][i][k] = d.NOMINEES[0][k] || "";
  if (act === "split" && d.NOMINEES.length) {
    const n = d.NOMINEES.length, base = Math.floor(10000 / n) / 100;
    d.NOMINEES.forEach((x, j) => x.share = String(j === n - 1 ? +(100 - base * (n - 1)).toFixed(2) : base));
  }
  save(); renderAll();
});
$("list").addEventListener("click", e => {
  const it = e.target.closest(".item");
  if (it) { selId = it.dataset.id; renderAll(); setTab("edit"); }
});
$("list").addEventListener("dblclick", e => { const it = e.target.closest(".item"); if (it && cur()) preview(cur()); });
$("q").addEventListener("input", e => { query = e.target.value; renderList(); });
$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  renderList();
});
$("bNew").onclick = () => {
  const c = {id: uid(), source: "手动输入", created: new Date().toISOString(), data: {
    POLICY: {}, POLICYOWNER: {muslim: "No", status: "Married", has_children: "Yes"},
    NOMINEES: [{nationality: "Malaysian"}], TRUSTEES: [], WITNESS: {is_agent: "Yes"}}};
  customers.push(c); selId = c.id; save(); filter = "all"; renderAll(); setTab("edit");
  $("f_POLICY_policy_no")?.focus();
};
$("bUpload").onclick = () => $("file").click();
$("file").onchange = e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importFiles(fs); };
$("bTemplate").onclick = downloadTemplate;
$("bPolicy").onclick = () => $("policyFile").click();
$("policyFile").onchange = e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importPolicies(fs); };
$("polApply").onclick = confirmCapture;
$("bPrintAll").onclick = printAll;
$("pvPrint").onclick = () => { const c = cur(); $("mPreview").classList.remove("open"); if (c) printOne(c); };
$("pvDownload").onclick = () => { const c = cur(); if (c) exportOne(c); };
$("bZip").onclick = exportZip;
$("bExportData").onclick = exportData;
$("bSettings").onclick = () => { $("sName").value = settings.agent_name; $("sIac").value = settings.agent_iac; openModal("mSettings"); };
$("bSaveSettings").onclick = () => {
  settings = {agent_name: upper($("sName").value), agent_iac: upper($("sIac").value)};
  store.set("nff_settings", settings); $("mSettings").classList.remove("open"); renderAll(); toast("设定已保存");
};
$("bClear").onclick = () => {
  $("mSettings").classList.remove("open");
  ask("清除全部资料", "清除这个浏览器里的全部保客资料？\n建议先「导出资料 Excel」备份。", {ok: "全部清除"}).then(yes => {
    if (yes) { customers = []; selId = null; save(); renderAll(); }
  });
};
// drag & drop files anywhere
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  const all = [...e.dataTransfer.files];
  const sheets = all.filter(f => /\.(xlsx|xls|csv)$/i.test(f.name)), policies = all.filter(f => /\.(pdf|jpe?g|png)$/i.test(f.name));
  if (sheets.length) importFiles(sheets);
  else if (policies.length) importPolicies(policies);
});
// installable app (GitHub Pages only): offline copy + "add to home screen" with the app icon
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
if (!HOSTED && location.protocol === "https:" && "serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvent = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; $("bInstall").hidden = false; fitHeader(); });
window.addEventListener("appinstalled", () => { $("bInstall").hidden = true; toast("已安装，可以从手机桌面的「保客填表」图标打开"); });
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (!HOSTED && !standalone && isIos && location.protocol === "https:") $("bInstall").hidden = false;
$("bInstall").onclick = async () => {
  if (installEvent) { installEvent.prompt(); await installEvent.userChoice; installEvent = null; $("bInstall").hidden = true; return; }
  ask("安装到 iPhone", "请用 Safari 打开这个网页：\n1. 点下方的「分享」按钮（方框加箭头）\n2. 选「加入主画面 / Add to Home Screen」\n3. 按「加入」\n\n桌面就会出现「保客填表」图标。", {ok: "知道了"});
};
// a hosted page cannot open the print dialog: save the PDF, then print it from the phone
if (HOSTED) { document.body.classList.add("hosted"); $("pvDownload").textContent = "保存 PDF 去打印"; }
renderAll();
setTab(customers.length ? "list" : "edit");
fitHeader();
</script>
</body>
</html>
